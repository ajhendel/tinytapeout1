name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttsky26c
        with:
          pdk: sky130A

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttsky26c

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttsky26c

  build_reports:
    # Two questions the build artifacts can answer and the build itself does not.
    #
    # Where did the flow actually put the things whose POSITION is the result?
    # Three of the calibration rings are byte-for-byte identical, so their
    # difference is a placement effect and nothing else, and we cannot ask the
    # flow for a position. This job measures what we got. It is a report and not
    # a gate: a clustered placement is a fact about the build that has to be
    # written down, not a reason to fail it.
    needs: gds
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      # The DEF is in GDS_logs, not in tt_submission. tt_submission carries the
      # GDS, LEF, SPEF and netlist, and none of those say where a cell is.
      - name: Download the GDS build logs
        uses: actions/download-artifact@v7
        with:
          name: GDS_logs
          path: submission

      - name: Report the achieved placement
        shell: bash
        run: |
          set -uo pipefail
          def=$(find submission -name '*.def' -size +1k | sort | tail -1)
          if [ -z "${def:-}" ]; then
            echo "no DEF in the artifact; nothing to report"
            exit 0
          fi
          echo "reporting on $def"
          python3 tools/check_placement.py "$def" --json placement.json

      # And does the time-to-digital converter have usable range for the paths
      # it is pointed at? That is answerable from extraction, before
      # fabrication, and the first version of this design shipped without
      # asking: the converter spanned 3.835 ns and one fabric site took 3.515 of
      # them. This step FAILS if a reference path leaves the fine range, because
      # a reference other measurements are quoted against must not depend on the
      # coarse counter. See docs/MEASUREMENT_PROTOCOL.md.
      - name: TDC range against every intended path
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          for sdf in $(find submission -path '*stapostpnr*' -name '*.sdf' | sort); do
            echo "=============================================================="
            python3 tools/tdc_range.py "$sdf" --markdown || rc=1
          done | tee tdc_range.md
          exit $rc

      - name: upload the build reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            placement.json
            tdc_range.md
          if-no-files-found: warn

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttsky26c
