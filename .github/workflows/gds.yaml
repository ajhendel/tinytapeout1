name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttsky26c
        with:
          pdk: sky130A

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttsky26c

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttsky26c

  build_reports:
    # Where did the flow actually put the things whose POSITION is the result?
    # Three of the calibration rings are byte-for-byte identical, so their
    # difference is a placement effect and nothing else, and we cannot ask the
    # flow for a position. This job measures what we got. It is a report and not
    # a gate: a clustered placement is a fact about the build that has to be
    # written down, not a reason to fail it.
    needs: gds
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      # The DEF is in GDS_logs, not in tt_submission. tt_submission carries the
      # GDS, LEF, SPEF and netlist, and none of those say where a cell is.
      - name: Download the GDS build logs
        uses: actions/download-artifact@v7
        with:
          name: GDS_logs
          path: submission

      - name: Report the achieved placement
        shell: bash
        run: |
          set -uo pipefail
          def=$(find submission -name '*.def' -size +1k | sort | tail -1)
          if [ -z "${def:-}" ]; then
            echo "no DEF in the artifact; nothing to report"
            exit 0
          fi
          echo "reporting on $def"
          python3 tools/check_placement.py "$def" --json placement.json

      - name: upload the placement report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: placement-report
          path: placement.json
          if-no-files-found: warn

  submission_gate:
    # The gate, and the reason it is a separate job from the report above.
    #
    # Everything here is a question answerable from extraction, before
    # fabrication, and every one of them was at some point NOT asked. The
    # converter shipped once with no range for the paths it was pointed at. The
    # drive series shipped once unable to produce a result. Both were visible in
    # the build's own reports and neither failed a test.
    #
    # So these run against the artifacts of THIS build, on THIS commit, and they
    # fail it. No continue-on-error: a gate that cannot fail the build is a
    # report, and there is a report job above for that.
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      - name: Download the GDS build logs
        uses: actions/download-artifact@v7
        with:
          name: GDS_logs
          path: artifacts/logs

      - name: Download the submission
        uses: actions/download-artifact@v7
        with:
          name: tt_submission
          path: artifacts/submission

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install the harness dependencies
        shell: bash
        run: pip install pyyaml

      # The three instrument gates, printed one corner at a time so the report
      # is readable, then the single verdict over all of them.
      - name: TDC range against every intended path
        shell: bash
        run: |
          # NOT piped into tee. Piping the loop runs it in a SUBSHELL, so rc=1
          # never reaches the parent and `exit $rc` is always exit 0. These
          # three steps were reporting success unconditionally, which is the
          # same defect as the continue-on-error they were split out to avoid.
          # An empty find would also have passed vacuously; now it fails.
          set -o pipefail
          rc=0
          n=0
          for sdf in $(find artifacts -path '*stapostpnr*' -name '*.sdf' | sort); do
            echo "==============================================================" >> tdc_range.md
            python3 tools/tdc_range.py "$sdf" --markdown >> tdc_range.md 2>&1 || rc=1
            n=$((n+1))
          done
          cat tdc_range.md
          if [ "$n" -eq 0 ]; then
            echo "no post place-and-route SDF found; nothing was checked" >&2
            exit 1
          fi
          echo "checked $n corners"
          exit $rc

      - name: The capture beats the ring kill
        # ALWAYS. A failing gate must not hide the evidence from the
        # gates after it: on the build of 2026-08-28 the race step
        # failed and the bin profile, the selector trend and the
        # report were never produced, so one cycle of CI answered
        # one question instead of five.
        if: always()
        shell: bash
        run: |
          # NOT piped into tee. Piping the loop runs it in a SUBSHELL, so rc=1
          # never reaches the parent and `exit $rc` is always exit 0. These
          # three steps were reporting success unconditionally, which is the
          # same defect as the continue-on-error they were split out to avoid.
          # An empty find would also have passed vacuously; now it fails.
          set -o pipefail
          rc=0
          n=0
          for sdf in $(find artifacts -path '*stapostpnr*' -name '*.sdf' | sort); do
            echo "==============================================================" >> tdc_race.md
            python3 tools/tdc_race.py "$sdf" --markdown >> tdc_race.md 2>&1 || rc=1
            n=$((n+1))
          done
          cat tdc_race.md
          if [ "$n" -eq 0 ]; then
            echo "no post place-and-route SDF found; nothing was checked" >&2
            exit 1
          fi
          echo "checked $n corners"
          exit $rc

      - name: The stop selector has no trend with the tap index
        # ALWAYS. A failing gate must not hide the evidence from the
        # gates after it: on the build of 2026-08-28 the race step
        # failed and the bin profile, the selector trend and the
        # report were never produced, so one cycle of CI answered
        # one question instead of five.
        if: always()
        shell: bash
        run: |
          # NOT piped into tee. Piping the loop runs it in a SUBSHELL, so rc=1
          # never reaches the parent and `exit $rc` is always exit 0. These
          # three steps were reporting success unconditionally, which is the
          # same defect as the continue-on-error they were split out to avoid.
          # An empty find would also have passed vacuously; now it fails.
          set -o pipefail
          rc=0
          n=0
          for sdf in $(find artifacts -path '*stapostpnr*' -name '*.sdf' | sort); do
            echo "==============================================================" >> stop_tree.md
            python3 tools/stop_tree.py "$sdf" --markdown >> stop_tree.md 2>&1 || rc=1
            n=$((n+1))
          done
          cat stop_tree.md
          if [ "$n" -eq 0 ]; then
            echo "no post place-and-route SDF found; nothing was checked" >&2
            exit 1
          fi
          echo "checked $n corners"
          exit $rc

      - name: The thermometer code is monotone and the bins are uniform
        # ALWAYS. A failing gate must not hide the evidence from the
        # gates after it: on the build of 2026-08-28 the race step
        # failed and the bin profile, the selector trend and the
        # report were never produced, so one cycle of CI answered
        # one question instead of five.
        if: always()
        shell: bash
        run: |
          # A tap's threshold is the line delay to it MINUS the sampling delay
          # to it. tdc_range.py checks the first half and tdc_race.py checks
          # the second, and until this step existed nothing subtracted them.
          # The build of 2026-08-28 passed both and shipped a bin 5.08 taps
          # wide in the middle of the range.
          set -o pipefail
          rc=0
          n=0
          for sdf in $(find artifacts -path '*stapostpnr*' -name '*.sdf' | sort); do
            echo "==============================================================" >> tdc_bins.md
            python3 tools/tdc_bins.py "$sdf" --markdown >> tdc_bins.md 2>&1 || rc=1
            n=$((n+1))
          done
          cat tdc_bins.md
          if [ "$n" -eq 0 ]; then
            echo "no post place-and-route SDF found; nothing was checked" >&2
            exit 1
          fi
          echo "checked $n corners"
          exit $rc

      - name: The launch and merge offsets do not bias the depth series
        # The depth series slope is the unit every delay on this chip is quoted
        # in. Its four short points launch from tree branch 2 and its 32 stage
        # point from branch 4, so a per-branch delay lands on the longest lever
        # arm and moves the SLOPE. Measured at 3.2 to 4.5 percent on the build
        # of 2026-08-28, which is why it is subtracted before the fit rather
        # than hoped away.
        if: always()
        shell: bash
        run: |
          set -o pipefail
          rc=0
          n=0
          for sdf in $(find artifacts -path '*stapostpnr*' -name '*.sdf' | sort); do
            echo "==============================================================" >> char_offsets.md
            python3 tools/char_offsets.py "$sdf" --markdown >> char_offsets.md 2>&1 || rc=1
            n=$((n+1))
          done
          cat char_offsets.md
          if [ "$n" -eq 0 ]; then
            echo "no post place-and-route SDF found; nothing was checked" >&2
            exit 1
          fi
          echo "checked $n corners"
          exit $rc

      - name: Every measured node is inside the Liberty table
        # A Liberty cell model is a table and a table has edges. sky130_fd_sc_hd
        # is characterized to 1.5 ns of input transition; past that the delay
        # static timing reports is an extrapolation off the end of it, and a
        # node whose Liberty number came from outside the table has not been
        # predicted by the Liberty layer at all. On a chip whose entire claim is
        # the size of model to silicon gaps, that is a claim risk and not just a
        # timing one. Worst measured node on this build is the characterization
        # merge at 1.318 ns, 88 percent of the limit.
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python3 tools/slew_range.py artifacts --markdown | tee slew_range.md

      # The numeric half of the pre-registration, from THIS build. Generated as
      # an artifact rather than committed here: committing it is a deliberate
      # act by a person against the final submission commit, and a workflow that
      # committed predictions on every push would make the timestamp worthless.
      - name: Generate the pre-registration numbers
        # ALWAYS. A failing gate must not hide the evidence from the
        # gates after it: on the build of 2026-08-28 the race step
        # failed and the bin profile, the selector trend and the
        # report were never produced, so one cycle of CI answered
        # one question instead of five.
        if: always()
        shell: bash
        run: |
          set -o pipefail
          # The DIRECTORY, not the path. Every corner's file is named
          # tt_um_ajhendel_evofab__<corner>.sdf, so the old pattern '/(tt|...)'
          # matched the filename of all nine and head -1 gave max_ff. The
          # predictions were generated at the fast corner for one build and
          # nothing said so. prereg.py now refuses a corner it was not asked
          # for, so this is checked in two places.
          sdf=$(find artifacts -path '*stapostpnr*/nom_tt_*' -name '*.sdf' | head -1)
          if [ -z "${sdf:-}" ]; then
            echo "no nom_tt corner in the artifacts; the pre-registration is" >&2
            echo "quoted at that corner and will not be generated at another" >&2
            exit 1
          fi
          echo "generating from $sdf"
          # spice/spice_ladder.json is committed from the spice workflow.
          # Without it the ladder pair has no prediction from any layer
          # that can represent the mechanism, and prereg.py says so.
          python3 tools/prereg.py "$sdf" --out prereg \
            --spice spice/spice_ladder.json

      - name: The submission report
        # ALWAYS. A failing gate must not hide the evidence from the
        # gates after it: on the build of 2026-08-28 the race step
        # failed and the bin profile, the selector trend and the
        # report were never produced, so one cycle of CI answered
        # one question instead of five.
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python3 tools/final_report.py artifacts --json final_report.json \
            | tee final_report.md

      - name: Put the report in the job summary
        if: always()
        shell: bash
        run: cat final_report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: upload the gate reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: submission-gate
          path: |
            tdc_range.md
            tdc_race.md
            tdc_bins.md
            char_offsets.md
            slew_range.md
            stop_tree.md
            final_report.md
            final_report.json
            prereg/
          if-no-files-found: warn

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttsky26c
