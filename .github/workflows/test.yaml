name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run tests
        run: |
          cd test
          make clean
          make
          # make will return success even if the test fails, so check for failure in the results.xml
          ! grep failure results.xml

      - name: Constants and documentation audit
        shell: bash
        run: |
          # Neither of these breaks a simulation. Both of them are what the next
          # reader will believe. See the note at the top of tools/doc_audit.py.
          python3 tools/gen_constants.py --check
          python3 tools/doc_audit.py

      - name: Constraint check (timing.sdc still points at the fabric pins)
        shell: bash
        run: |
          pip install pyyaml
          python3 tools/check_constraints.py

      - name: Harness tests (genome, operators, and Python model vs RTL)
        shell: bash
        run: |
          pip install pytest
          python -m pytest harness/tests -q

      - name: Install yosys for the structural netlist check
        shell: bash
        run: sudo apt-get install -y yosys

      - name: Structural netlist check
        shell: bash
        run: |
          # The flow's own multiple-driver check is disabled in src/config.json
          # because this design has deliberate tri-state buses. This replaces it.
          tools/area_sweep.sh build/area
          python3 tools/check_netlist.py build/area/n8.json --sites 8

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*
